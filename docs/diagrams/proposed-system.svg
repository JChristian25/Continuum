<text x="755" y="177" class="head">Relationship review</text>
<text x="755" y="202" class="body">Evidence-backed candidates</text>
<text x="755" y="227" class="body">Human judgment and reason</text>
<rect x="735" y="340" width="300" height="150" rx="12" fill="#102b2a" stroke="#365c52"/>
