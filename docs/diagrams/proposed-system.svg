<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">How the proposed system fits together</title><desc id="desc">Versioned inputs feed artifact context, human relationship review, revision revalidation and current or historical knowledge access.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8bcdbd"/></marker></defs><rect width="1100" height="720" rx="20" fill="#071718"/><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:25px;font-weight:700;fill:#effcf7}.sub{font-size:15px;fill:#9fbeb6}.head{font-size:19px;font-weight:700;fill:#d7fff1}.body{font-size:16px;fill:#c0d6d0}.tag{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#95e0c8}.edge{fill:none;stroke:#8bcdbd;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;fill:#a4c6ba}</style>
<text x="36" y="43" class="title">How the proposed system fits together</text>
<text x="36" y="70" class="sub">PROPOSED SYSTEM · Specification stage · Backend integration is not implemented</text>
