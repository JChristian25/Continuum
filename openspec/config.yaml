schema: spec-driven

context: |
  Continuum's sole implementation source is D:\[Research] SKCF\prototype.
  Inspect only this project; do not inspect sibling folders or use another local
  project as its backend, source of truth, or evidence baseline.
  Frontend package and its lockfiles/configuration live under apps/web/.
  Run frontend npm commands with npm --prefix apps/web from the repository root.
  Current implementation: React 19 / Vite 8, JavaScript/JSX, connected FastAPI/
  PostgreSQL service, provisioned accounts and server sessions. Synthetic data
  is available only through explicit ?mode=demo; errors never fall back to it.
  Current development evidence and remaining boundaries are recorded in
  services/api/CONTINUITY.md and the active change implementation.md.
  On 2026-11-13 the user authorized implementation and selected FastAPI,
  PostgreSQL, provisioned accounts and server-side sessions. Follow the active
  implementation.md and tasks.md for implemented and pending boundaries.
  Do not ingest/clone external source, migrate existing data, deploy, or archive
  unimplemented requirements without the corresponding explicit scope.
  Preserve PRODUCT.md and DESIGN.md and the current visual design.
  Existing specs/ documents are research context and engineering proposals;
  extract focused behavior from them rather than bulk-converting them.
  openspec/specs describes observed current behavior. Proposed unimplemented
  capabilities belong in openspec/changes until implemented and verified.
  Healthchecks is the accepted future test-project identity, with Python as the
  selected language and Markdown/plain-text documents at file scope. Plain text
  was explicitly included by the user in the latest-manuscript reconciliation. Source acquisition, exact revisions and inventory
  are now bounded by healthchecks-input-acceptance.json and the separate frozen
  discovery-profile-acceptance.json in the active change. Use their exact scope;
  do not infer broader acquisition or read other local checkouts.
  The previously registered highlighted manuscript is unavailable at its exact
  path. The user separately supplied Chapter 1 - 3.pdf; the current audit,
  source hash and checked anchors are in outputs/manuscript-audit/.
  Preserve older manuscript records as earlier evidence; do not claim an
  unavailable source was rechecked. Implementation is not practitioner evaluation.
  The thesis supplied in the planning chat bounds the core and extensions;
  traceability anchors already recorded in specs/requirements.md are references,
  not proof of implementation or independent accuracy/productivity gains.
  Write in English using plain, neutral prose and Humanizer's editorial principles.
  Separate observed, accepted, proposed, and unknown claims.

rules:
  proposal:
    - State one continuity outcome and name what remains out of scope.
    - Cite relevant C-/X-/HC- requirements without treating extensions as core.
    - State that planning does not authorize implementation.
  specs:
    - Each requirement must state one observable behavior using SHALL or MUST.
    - Give each requirement at least one named Scenario using WHEN and THEN.
    - Cover uncertainty, exact revision context, historical preservation, and permission failures where relevant.
    - Keep storage/framework/algorithm choices in design.md unless externally observable.
    - Keep stable requirement IDs and distinguish current behavior from proposed deltas.
  design:
    - Ground decisions in authored files inside this project.
    - Record open decisions explicitly instead of inventing an existing backend.
    - Preserve the UI and keep candidate validity, content concerns, and follow-up separate.
  tasks:
    - Keep future implementation tasks unchecked during specification work.
    - Include concrete verification and meaningful negative cases with requirement IDs.
    - Mark prerequisites and unresolved choices; artifact existence is not implementation readiness.

operations:
  apply:
    guidance:
      - Implementation was requested on 2026-11-13; follow implementation.md and preserve unresolved source-acquisition gates.
  archive:
    guidance:
      - Never merge proposed backend behavior into current specs before implementation and verification.
