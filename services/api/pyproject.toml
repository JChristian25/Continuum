[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-api"
version = "0.1.0"
description = "Continuum versioned relationship review service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "neo4j>=6.4.1,<7",
  "redis>=5.0,<9",
  "rq>=2.0,<4",
  "tree-sitter>=0.24,<1",
  "tree-sitter-python>=0.23,<1",
  "docling-slim>=2.100,<3",
  "docling-core>=2.100,<3",
  "marko>=2.0,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
continuum-admin = "continuum.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
